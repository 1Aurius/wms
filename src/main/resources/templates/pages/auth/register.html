<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - WMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center p-5">
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-2">Create Account</h1>
        <p class="text-center text-gray-600 mb-6">Register for WMS System</p>

        <div id="alertBox" class="hidden mb-5 p-3 rounded-lg"></div>

        <form id="registerForm" novalidate class="space-y-5">
            <!-- Username -->
            <div>
                <label for="nome" class="block text-sm font-medium text-gray-700 mb-2">Username *</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors"
                >
                <span id="nomeError" class="hidden text-red-600 text-sm mt-1">Username is required (minimum 3 characters)</span>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password *</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors"
                >
                <span id="passwordError" class="hidden text-red-600 text-sm mt-1">Password is required (minimum 6 characters)</span>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password *</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors"
                >
                <span id="confirmPasswordError" class="hidden text-red-600 text-sm mt-1">Passwords must match</span>
            </div>

            <!-- Date of Birth -->
            <div>
                <label for="dn" class="block text-sm font-medium text-gray-700 mb-2">Date of Birth *</label>
                <input
                    type="date"
                    id="dn"
                    name="dn"
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 transition-colors"
                >
                <span id="dnError" class="hidden text-red-600 text-sm mt-1">Date of birth is required</span>
            </div>

            <!-- Roles Section -->
            <div class="bg-gray-50 rounded-lg p-4">
                <h3 class="text-sm font-semibold text-gray-800 mb-3">Roles</h3>
                <div class="space-y-3">
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="admin" name="admin" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-3 text-sm text-gray-700">Administrator</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="gestorRotas" name="gestorRotas" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-3 text-sm text-gray-700">Route Manager</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="gestor" name="gestor" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-3 text-sm text-gray-700">Manager</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="loja" name="loja" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-3 text-sm text-gray-700">Store</span>
                    </label>
                    <label class="flex items-center cursor-pointer">
                        <input type="checkbox" id="armazem" name="armazem" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500">
                        <span class="ml-3 text-sm text-gray-700">Warehouse</span>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button
                type="submit"
                id="submitBtn"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-3 rounded-lg hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 transform hover:-translate-y-0.5 hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
            >
                Create Account
            </button>
        </form>

        <!-- Login Link -->
        <p class="text-center text-gray-600 mt-6">
            Already have an account?
            <a href="/login" class="text-indigo-600 font-semibold hover:text-indigo-700 hover:underline">Login here</a>
        </p>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alertBox');


        // Show alert
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'mb-5 p-3 rounded-lg';
            if (type === 'success') {
                alertBox.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-300');
            } else {
                alertBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-300');
            }
            setTimeout(() => {
                alertBox.classList.add('hidden');
            }, 5000);
        }

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            const formData = {
                nome: document.getElementById('nome').value.trim(),
                password: document.getElementById('password').value,
                dn: document.getElementById('dn').value,
                admin: document.getElementById('admin').checked,
                gestorRotas: document.getElementById('gestorRotas').checked,
                gestor: document.getElementById('gestor').checked,
                loja: document.getElementById('loja').checked,
                armazem: document.getElementById('armazem').checked
            };

            try {
                const response = await fetch('/api/users/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.text();

                if (response.ok) {
                    showAlert('Account created successfully! Redirecting to login...', 'success');
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showAlert(data || 'Registration failed. Please try again.', 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Create Account';
                }
            } catch (error) {
                showAlert('An error occurred. Please try again later.', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });

        // Real-time validation
        document.getElementById('nome').addEventListener('input', () => {
            if (document.getElementById('nome').value.trim().length >= 3) {
                document.getElementById('nome').classList.remove('border-red-500');
                document.getElementById('nomeError').classList.add('hidden');
            }
        });

        document.getElementById('password').addEventListener('input', () => {
            if (document.getElementById('password').value.length >= 6) {
                document.getElementById('password').classList.remove('border-red-500');
                document.getElementById('passwordError').classList.add('hidden');
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', () => {
            if (document.getElementById('confirmPassword').value === document.getElementById('password').value) {
                document.getElementById('confirmPassword').classList.remove('border-red-500');
                document.getElementById('confirmPasswordError').classList.add('hidden');
            }
        });

        document.getElementById('dn').addEventListener('change', () => {
            if (document.getElementById('dn').value) {
                document.getElementById('dn').classList.remove('border-red-500');
                document.getElementById('dnError').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
